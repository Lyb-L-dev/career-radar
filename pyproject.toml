[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "career-radar"
version = "1.2.0"
description = "企业官网招聘信息自动监控与完整 JD 提取工具"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Career Radar Contributors" }]
dependencies = [
  "anthropic>=0.55,<2",
  "beautifulsoup4>=4.12,<5",
  "fastapi>=0.115,<1",
  "openai>=2.37,<3",
  "playwright>=1.49,<2",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
  "tzdata>=2025.2; platform_system == 'Windows'",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pdfplumber>=0.11,<1",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
career-radar = "career_radar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
